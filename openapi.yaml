openapi: 3.0.0
info:
  title: PharmaLink API
  description: Medicine stock finder and inventory management API.
  version: 1.0.0
paths:
  /medicines:
    get:
      summary: Return a list of available medicine stock with search filters
      parameters:
        - name: q
          in: query
          description: Search query for medicine name
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved medicine list
    post:
      summary: Create a new medicine record in inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category, stockLevel, unitPrice]
              properties:
                name: { type: string }
                category: { type: string }
                stockLevel: { type: integer }
                unitPrice: { type: number }
      responses:
        '201':
          description: Created successfully
  /medicines/{id}:
    get:
      summary: Return details for a specific medication ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Success
        '404':
          description: Not found
  /pharmacies:
    get:
      summary: Return a list of all partner pharmacies
      responses:
        '200':
          description: Success
  /pharmacies/{id}:
    get:
      summary: Return details for a specific pharmacy ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Success
        '404':
          description: Not found