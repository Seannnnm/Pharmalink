openapi: 3.0.0
info:
  title: PharmaLink API
  version: 1.0.0
paths:
  /inventory:
    get:
      summary: Return a list of stock availability and prices for a specific medication across different pharmacies.
      parameters:
        - name: medicineId
          in: query
          required: true
          schema:
            type: string
            example: "med-amoxicillin-500"
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            example: "price"
      responses:
        '200':
          description: A list of inventory records for the requested medicine.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - pharmacyId
                    - pharmacyName
                    - price
                    - stockQuantity
                  properties:
                    pharmacyId:
                      type: string
                      example: "pharm-afyacare-01"
                    pharmacyName:
                      type: string
                      example: "AfyaCare Pharmacy"
                    price:
                      type: integer
                      description: Price in KSh
                      example: 120
                    stockQuantity:
                      type: integer
                      example: 24

  /inventory/{id}:
    get:
      summary: Return the exact real-time stock level and details for a single inventory record.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "inv-8837"
      responses:
        '200':
          description: A single inventory record.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - medicineName
                  - inStock
                  - price
                properties:
                  id:
                    type: string
                    example: "inv-8837"
                  medicineName:
                    type: string
                    example: "Amoxicillin"
                  inStock:
                    type: integer
                    example: 3
                  price:
                    type: integer
                    example: 180

  /pharmacies:
    get:
      summary: Return a list of verified pharmacies with their geographic coordinates.
      responses:
        '200':
          description: A list of pharmacies.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - id
                    - name
                    - locationArea
                    - verified
                  properties:
                    id:
                      type: string
                      example: "pharm-afyacare-01"
                    name:
                      type: string
                      example: "AfyaCare Pharmacy"
                    locationArea:
                      type: string
                      example: "Nairobi CBD"
                    verified:
                      type: boolean
                      example: true

  /pharmacies/{id}:
    get:
      summary: Return detailed contact information for a single pharmacy to enable Call and Directions.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "pharm-afyacare-01"
      responses:
        '200':
          description: Detailed pharmacy information.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - name
                  - address
                  - phone
                  - distanceKm
                properties:
                  id:
                    type: string
                    example: "pharm-afyacare-01"
                  name:
                    type: string
                    example: "AfyaCare Pharmacy"
                  address:
                    type: string
                    example: "Moi Avenue, Nairobi CBD"
                  phone:
                    type: string
                    example: "+254700000000"
                  distanceKm:
                    type: number
                    format: float
                    example: 0.7

  /reservations:
    post:
      summary: Create a new reservation for a patient to secure a specific medication at a chosen pharmacy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - inventoryId
                - patientInitials
                - quantity
              properties:
                inventoryId:
                  type: string
                  example: "inv-8837"
                patientInitials:
                  type: string
                  example: "S.M."
                quantity:
                  type: integer
                  example: 1
      responses:
        '201':
          description: Reservation successfully created.
          content:
            application/json:
              schema:
                type: object
                required:
                  - reservationId
                  - status
                  - estimatedPickupMin
                properties:
                  reservationId:
                    type: string
                    example: "res-9921"
                  status:
                    type: string
                    example: "confirmed"
                  estimatedPickupMin:
                    type: integer
                    example: 7